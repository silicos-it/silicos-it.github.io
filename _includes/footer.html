<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-row">
      <p class="feed-subscribe">
        <a href="{{ 'feed.xml' | relative_url }}">
          <img src="/assets/rss-icon.svg" width="20" height="20" alt="">
          <span>Subscribe</span>
        </a>
      </p>

      <div class="social-links">
        {%- include social.html -%}
      </div>

      <p class="contact-list">
        Contact and copyright {{ site.copyright | escape }} <a class="u-email" href="mailto:{{ site.social.email | join:',' }}">{{ site.social.name | escape }}</a>
        <br>Updated on {{ site.time }}
      </p>
    </div>

  </div>

</footer>
