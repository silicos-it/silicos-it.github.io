<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#1a3448"/>
    </linearGradient>
    <!-- Subtle molecule node decoration -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26c6b0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#26c6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <ellipse cx="600" cy="315" rx="520" ry="280" fill="url(#glow)"/>

  <!-- Decorative molecule graph (top-right) -->
  <g opacity="0.12" stroke="#26c6b0" stroke-width="2" fill="none">
    <line x1="900" y1="80"  x2="1020" y2="140"/>
    <line x1="1020" y1="140" x2="1080" y2="80"/>
    <line x1="1020" y1="140" x2="1040" y2="240"/>
    <line x1="1040" y1="240" x2="960" y2="280"/>
    <line x1="960" y1="280" x2="900" y2="200"/>
    <line x1="900" y1="200" x2="900" y2="80"/>
    <line x1="900" y1="200" x2="1040" y2="240"/>
  </g>
  <g opacity="0.18" fill="#26c6b0">
    <circle cx="900"  cy="80"  r="7"/>
    <circle cx="1020" cy="140" r="9"/>
    <circle cx="1080" cy="80"  r="6"/>
    <circle cx="1040" cy="240" r="8"/>
    <circle cx="960"  cy="280" r="7"/>
    <circle cx="900"  cy="200" r="9"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="5" height="310" fill="#26c6b0" rx="3"/>

  <!-- Logo / brand name -->
  <text x="110" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Silicos-it
  </text>

  <!-- Tagline -->
  <text x="110" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="32" font-weight="400" fill="#26c6b0" letter-spacing="1">
    Computational Drug Design
  </text>

  <!-- Divider -->
  <line x1="110" y1="340" x2="700" y2="340" stroke="#26c6b0" stroke-width="1" opacity="0.4"/>

  <!-- Sub-services -->
  <text x="110" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" fill="#aac8d8" opacity="0.9">
    Virtual Screening · Molecular Dynamics · QSAR · Pharmacophore Modeling
  </text>

  <!-- URL -->
  <text x="110" y="510" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" fill="#ffffff" opacity="0.5">
    www.silicos-it.be
  </text>
</svg>
